name: GateShield reusable security workflow

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to .gateshield.yml
        required: false
        type: string
        default: .gateshield.yml
      upload_sarif:
        description: Upload consolidated SARIF to GitHub Code Scanning
        required: false
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: GateShield
        id: gateshield
        uses: matgasp/gateshield@v1
        with:
          config_path: ${{ inputs.config_path }}

      - name: Stage SARIF for Code Scanning job
        if: always() && inputs.upload_sarif
        uses: actions/upload-artifact@v4
        with:
          name: gateshield-sarif-transfer-${{ github.run_id }}
          path: .gateshield/out/gateshield.sarif
          retention-days: 1
          if-no-files-found: ignore

  code-scanning:
    if: always() && inputs.upload_sarif
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF
        uses: actions/download-artifact@v8
        with:
          name: gateshield-sarif-transfer-${{ github.run_id }}
          path: .gateshield/sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .gateshield/sarif/gateshield.sarif
