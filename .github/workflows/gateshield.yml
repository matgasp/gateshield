name: GateShield reusable security workflow

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to .gateshield.yml
        required: false
        type: string
        default: .gateshield.yml
      upload_sarif:
        description: Upload consolidated SARIF to GitHub Code Scanning
        required: false
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: GateShield
        id: gateshield
        uses: matgasp/gateshield@v0.0.1
        with:
          config_path: ${{ inputs.config_path }}

      - name: Stage SARIF for Code Scanning job
        if: always() && inputs.upload_sarif
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateshield-sarif-transfer-${{ github.run_id }}
          path: .gateshield/out/gateshield.sarif
          retention-days: 1
          if-no-files-found: ignore

  code-scanning:
    if: always() && inputs.upload_sarif
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gateshield-sarif-transfer-${{ github.run_id }}
          path: .gateshield/sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .gateshield/sarif/gateshield.sarif
