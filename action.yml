name: GateShield
description: Policy-driven security checks and gates for hardened CI/CD pipelines
author: Matheus Gasperazzo

inputs:
  config_path:
    description: Path to .gateshield.yml
    required: false
    default: .gateshield.yml
  python_version:
    description: Python version used to run GateShield
    required: false
    default: "3.13"

outputs:
  report_path:
    description: Consolidated GateShield JSON report
    value: ${{ steps.scan.outputs.report_path }}
  sarif_path:
    description: Consolidated GateShield SARIF report
    value: ${{ steps.scan.outputs.sarif_path }}
  final_exit_code:
    description: GateShield final exit code
    value: ${{ steps.scan.outputs.final_exit_code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install GateShield
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ github.action_path }}"

    - name: Run GateShield
      id: scan
      shell: bash
      run: gateshield scan . --config "${{ inputs.config_path }}" --defer-exit

    - name: Upload SAST artifact
      if: always() && steps.scan.outputs.sast_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.sast_name }}
        path: ${{ steps.scan.outputs.sast_path }}
        retention-days: ${{ steps.scan.outputs.sast_retention }}
        if-no-files-found: ignore

    - name: Upload SCA artifact
      if: always() && steps.scan.outputs.sca_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.sca_name }}
        path: ${{ steps.scan.outputs.sca_path }}
        retention-days: ${{ steps.scan.outputs.sca_retention }}
        if-no-files-found: ignore

    - name: Upload secrets artifact
      if: always() && steps.scan.outputs.secrets_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.secrets_name }}
        path: ${{ steps.scan.outputs.secrets_path }}
        retention-days: ${{ steps.scan.outputs.secrets_retention }}
        if-no-files-found: ignore

    - name: Upload IaC artifact
      if: always() && steps.scan.outputs.iac_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.iac_name }}
        path: ${{ steps.scan.outputs.iac_path }}
        retention-days: ${{ steps.scan.outputs.iac_retention }}
        if-no-files-found: ignore

    - name: Upload container artifact
      if: always() && steps.scan.outputs.container_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.container_name }}
        path: ${{ steps.scan.outputs.container_path }}
        retention-days: ${{ steps.scan.outputs.container_retention }}
        if-no-files-found: ignore

    - name: Upload SBOM artifact
      if: always() && steps.scan.outputs.sbom_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.sbom_name }}
        path: ${{ steps.scan.outputs.sbom_path }}
        retention-days: ${{ steps.scan.outputs.sbom_retention }}
        if-no-files-found: ignore

    - name: Upload DAST artifact
      if: always() && steps.scan.outputs.dast_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.dast_name }}
        path: ${{ steps.scan.outputs.dast_path }}
        retention-days: ${{ steps.scan.outputs.dast_retention }}
        if-no-files-found: ignore

    - name: Upload custom artifact 1
      if: always() && steps.scan.outputs.custom_0_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.custom_0_name }}
        path: ${{ steps.scan.outputs.custom_0_path }}
        retention-days: ${{ steps.scan.outputs.custom_0_retention }}
        if-no-files-found: ignore

    - name: Upload custom artifact 2
      if: always() && steps.scan.outputs.custom_1_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.custom_1_name }}
        path: ${{ steps.scan.outputs.custom_1_path }}
        retention-days: ${{ steps.scan.outputs.custom_1_retention }}
        if-no-files-found: ignore

    - name: Upload custom artifact 3
      if: always() && steps.scan.outputs.custom_2_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.custom_2_name }}
        path: ${{ steps.scan.outputs.custom_2_path }}
        retention-days: ${{ steps.scan.outputs.custom_2_retention }}
        if-no-files-found: ignore

    - name: Upload custom artifact 4
      if: always() && steps.scan.outputs.custom_3_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.custom_3_name }}
        path: ${{ steps.scan.outputs.custom_3_path }}
        retention-days: ${{ steps.scan.outputs.custom_3_retention }}
        if-no-files-found: ignore

    - name: Upload custom artifact 5
      if: always() && steps.scan.outputs.custom_4_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.scan.outputs.custom_4_name }}
        path: ${{ steps.scan.outputs.custom_4_path }}
        retention-days: ${{ steps.scan.outputs.custom_4_retention }}
        if-no-files-found: ignore

    - name: Enforce GateShield result
      if: always()
      shell: bash
      run: exit "${{ steps.scan.outputs.final_exit_code || '4' }}"
